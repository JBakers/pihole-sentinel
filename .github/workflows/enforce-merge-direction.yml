name: Enforce Merge Direction

# This workflow prevents merges in the wrong direction.
# Allowed: feature branches -> develop, develop -> main
# Blocked: all other branch directions

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-merge-direction:
    runs-on: ubuntu-latest
    name: Check PR Merge Direction

    steps:
      - name: Check merge direction
        id: check
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch (merge target): $BASE_BRANCH"
          echo "Head branch (source): $HEAD_BRANCH"

          # Define allowed merge patterns
          # Format: "source->target"

          BLOCKED=false
          REASON=""

          # Only the validated develop branch may be promoted to main.
          if [[ "$BASE_BRANCH" == "main" ]] && [[ "$HEAD_BRANCH" != "develop" ]]; then
            BLOCKED=true
            REASON="BLOCKED: Only develop may merge into main"
          fi

          # Block: main -> develop
          if [[ "$BASE_BRANCH" == "develop" ]] && [[ "$HEAD_BRANCH" == "main" ]]; then
            BLOCKED=true
            REASON="BLOCKED: Cannot merge main -> develop (wrong direction)"
          fi

          # Block: develop -> feature branches
          if [[ "$HEAD_BRANCH" == "develop" ]] && [[ "$BASE_BRANCH" =~ ^(feature|fix|chore|docs)/ ]]; then
            BLOCKED=true
            REASON="BLOCKED: Cannot merge develop -> feature branch (wrong direction)"
          fi

          # Check if blocked
          if [[ "$BLOCKED" == "true" ]]; then
            echo "::error::$REASON"
            echo ""
            echo "ALLOWED merge directions:"
            echo "   - feature/* -> develop"
            echo "   - develop -> main (owner-controlled release promotion)"
            echo ""
            echo "Your PR: $HEAD_BRANCH -> $BASE_BRANCH"
            echo ""
            echo "Please close this PR and create one in the correct direction."
            exit 1
          fi

          # If we reach here, merge direction is allowed
          echo "Merge direction is ALLOWED: $HEAD_BRANCH -> $BASE_BRANCH"

          # Provide helpful info about the merge
          if [[ "$BASE_BRANCH" == "develop" ]]; then
            echo "Merging to develop - this is the integration branch"
          elif [[ "$BASE_BRANCH" == "main" ]]; then
            echo "Merging to main - the repository owner controls this production promotion"
          fi

      - name: Add merge direction comment
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const baseRef = context.payload.pull_request.base.ref;
            const headRef = context.payload.pull_request.head.ref;

            let message = '';

            if (baseRef === 'main') {
              message = '**Production Release**\n\nThis PR promotes `develop` to `main`. Only the repository owner may complete this merge after release validation.';
            } else if (baseRef === 'develop') {
              message = '**Development Branch**\n\nThis PR will merge to `develop` - integration and development testing.';
            }

            const comment = '**Merge Direction Check: PASSED**\n\n' +
              message + '\n\n' +
              '**Merge flow:** `' + headRef + '` -> `' + baseRef + '`\n\n' +
              '<details>\n' +
              '<summary>Allowed merge directions</summary>\n\n' +
              '- `feature/*` -> `develop`\n' +
              '- `develop` -> `main` (owner-controlled release promotion)\n' +
              '- All other merge directions are blocked\n\n' +
              '</details>';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
